<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Frame of the Chrome Web Store screenshots (1280 × 800): a caption above a browser window, in the
     colours of ../og-image.html. scripts/store-assets.ts fills the placeholders in double braces. -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
      }
      body {
        background:
          radial-gradient(760px 420px at 100% 0%, rgba(215, 93, 115, 0.2), transparent 70%),
          radial-gradient(600px 380px at 0% 0%, rgba(255, 179, 147, 0.22), transparent 70%), #fff7f8;
        color: #2a1a1e;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
        position: relative;
      }
      header {
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 34px 60px 0;
        height: 150px;
      }
      header svg {
        flex: none;
      }
      h1 {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      h1 b {
        color: #d75d73;
      }
      header p {
        margin-top: 8px;
        font-size: 21px;
        color: #6b545a;
      }
      .window {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 150px;
        bottom: 0;
        border-radius: 14px 14px 0 0;
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 30px 60px -20px rgba(122, 35, 53, 0.35),
          0 0 0 1px rgba(122, 35, 53, 0.1);
      }
      .bar {
        height: 40px;
        background: #f4eef0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #e2d3d7;
      }
      .url {
        margin-left: 18px;
        flex: 1;
        height: 26px;
        border-radius: 13px;
        background: #fff;
        color: #8a6a72;
        font-size: 14px;
        display: flex;
        align-items: center;
        padding: 0 14px;
      }
      .ext {
        width: 22px;
        height: 22px;
      }
      .shot {
        display: block;
        width: 100%;
      }
      .popup {
        position: absolute;
        top: 46px;
        right: 10px;
        width: 340px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #e2d3d7;
        box-shadow: 0 16px 40px rgba(42, 26, 30, 0.3);
      }
      .popup img {
        display: block;
        width: 100%;
      }
      .popup:empty {
        display: none;
      }
      .ring {
        position: absolute;
        width: 60px;
        height: 92px;
        border-radius: 20px;
        border: 4px solid #d75d73;
        box-shadow: 0 0 0 8px rgba(215, 93, 115, 0.2);
      }
    </style>
  </head>
  <body>
    <header>
      <div style="width: 72px; height: 72px">{{ICON}}</div>
      <div>
        <h1>{{TITLE}}</h1>
        <p>{{TEXT}}</p>
      </div>
    </header>
    <div class="window">
      <div class="bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="url">{{HOST}}</span>
        <span class="ext">{{ICON}}</span>
      </div>
      <img class="shot" src="{{SHOT}}" alt="" />
      <div class="popup">{{POPUP}}</div>
      {{EXTRA}}
    </div>
  </body>
</html>
