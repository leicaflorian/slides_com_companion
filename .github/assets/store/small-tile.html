<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Chrome Web Store small promo tile, 440 × 280. Rendered by scripts/store-assets.ts. -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 440px;
        height: 280px;
      }
      body {
        background:
          radial-gradient(360px 260px at 100% 100%, rgba(215, 93, 115, 0.24), transparent 70%),
          radial-gradient(300px 220px at 0% 0%, rgba(255, 179, 147, 0.25), transparent 70%), #fff7f8;
        color: #2a1a1e;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 34px;
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand .icon {
        width: 64px;
        height: 64px;
        flex: none;
      }
      h1 {
        font-size: 30px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        font-weight: 500;
      }
      h1 b {
        display: block;
        font-weight: 800;
        color: #d75d73;
      }
      p {
        margin-top: 20px;
        font-size: 19px;
        line-height: 1.35;
        font-weight: 600;
      }
      p b {
        color: #d75d73;
      }
      .meta {
        margin-top: 12px;
        font-size: 14px;
        color: #8a6a72;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="icon">{{ICON}}</div>
      <h1><b>Slides.com</b>Companion</h1>
    </div>
    <p><b>Print</b>, save as <b>PDF</b> and open the <b>speaker view</b> on any Slides.com presentation.</p>
    <p class="meta">Free · Open source · No data collected</p>
  </body>
</html>
