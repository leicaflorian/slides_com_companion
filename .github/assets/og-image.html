<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
      }
      body {
        background:
          radial-gradient(760px 520px at 100% 100%, rgba(215, 93, 115, 0.22), transparent 70%),
          radial-gradient(600px 420px at 0% 0%, rgba(255, 179, 147, 0.25), transparent 70%), #fff7f8;
        color: #2a1a1e;
        font-family: Inter, system-ui, sans-serif;
        display: flex;
        align-items: center;
        padding: 0 0 0 72px;
        gap: 52px;
        overflow: hidden;
      }
      .left {
        flex: 0 0 520px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
      }
      .brand img {
        width: 92px;
        height: 92px;
      }
      .brand h1 {
        font-size: 46px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        font-weight: 500;
      }
      .brand h1 b {
        font-weight: 800;
        color: #d75d73;
      }
      .tagline {
        font-size: 28px;
        line-height: 1.3;
        font-weight: 600;
        color: #2a1a1e;
      }
      .tagline em {
        font-style: normal;
        color: #d75d73;
      }
      .features {
        margin-top: 30px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 17px;
        font-weight: 600;
        color: #7a2335;
        background: #fff;
        border: 1px solid #f0c9d1;
        padding: 8px 14px;
        border-radius: 999px;
      }
      .meta {
        margin-top: 24px;
        font-size: 17px;
        color: #8a6a72;
      }

      /* browser window with a slide and the docked toolbar */
      .window {
        flex: 0 0 636px;
        height: 470px;
        background: #fff;
        border-radius: 16px 0 0 16px;
        box-shadow:
          0 30px 60px -20px rgba(122, 35, 53, 0.35),
          0 0 0 1px rgba(122, 35, 53, 0.08);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .chrome {
        height: 44px;
        background: #f4eef0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        flex: none;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #e2d3d7;
      }
      .url {
        margin-left: 18px;
        flex: 0 0 300px;
        height: 26px;
        border-radius: 13px;
        background: #fff;
        font-size: 13px;
        color: #8a6a72;
        display: flex;
        align-items: center;
        padding: 0 14px;
      }
      .stage {
        position: relative;
        flex: 1;
        background: #2b2d3a;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slide {
        width: 430px;
        height: 290px;
        background: #fbfaf7;
        border-radius: 6px;
        padding: 46px 48px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-right: 110px;
      }
      .slide .k {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #d75d73;
        text-transform: uppercase;
      }
      .slide .t {
        font-size: 38px;
        font-weight: 800;
        line-height: 1.1;
        color: #2a1a1e;
        letter-spacing: -0.02em;
      }
      .slide .l {
        height: 10px;
        border-radius: 5px;
        background: #e8e2e4;
      }
      /* same look as the real toolbar (src/entrypoints/content/style.scss), open with the mouse on Print */
      .toolbar {
        position: absolute;
        right: 0;
        top: 26px;
        background: rgba(22, 22, 28, 0.86);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        border-radius: 14px 0 0 14px;
        padding: 8px 10px 8px 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .toolbar .chev {
        width: 22px;
        height: 22px;
        display: flex;
        color: rgba(255, 255, 255, 0.6);
        transform: rotate(180deg);
      }
      .btn {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        color: #fff;
        font:
          600 11px/1 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .btn.hover {
        background: #d75d73;
      }
      .btn svg {
        width: 22px;
        height: 22px;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="brand">
        <img src="../../Chrome Web Store/icon/icon.svg" alt="" />
        <h1><b>Slides.com</b><br />Companion</h1>
      </div>
      <p class="tagline">Print, save as PDF and open the speaker view on any <em>Slides.com</em> presentation.</p>
      <div class="features">
        <span class="chip">Print / Save as PDF</span>
        <span class="chip">Speaker View</span>
        <span class="chip">Speaker Notes</span>
        <span class="chip">Free</span>
      </div>
      <p class="meta">Chrome &amp; Edge extension · Manifest V3 · MIT</p>
    </div>

    <div class="window">
      <div class="chrome">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span
        ><span class="url">slides.com/your-talk</span>
      </div>
      <div class="stage">
        <div class="slide">
          <span class="k">Chapter 1</span>
          <span class="t">Make better<br />presentations</span>
          <span class="l" style="width: 78%"></span>
          <span class="l" style="width: 56%"></span>
        </div>
        <div class="toolbar">
          <span class="chev"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 6l-6 6 6 6" /></svg
          ></span>
          <span class="btn hover">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 9V3h12v6" />
              <rect x="3" y="9" width="18" height="8" rx="2" />
              <rect x="7" y="14" width="10" height="7" rx="1" />
            </svg>
            Print
          </span>
          <span class="btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="4" width="13" height="10" rx="1.5" />
              <rect x="17" y="6" width="5" height="6" rx="1" />
              <path d="M5 18h14M8 21h8" />
            </svg>
            Speaker
          </span>
          <span class="btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="5" y="3" width="14" height="18" rx="2" />
              <path d="M9 8h6M9 12h6M9 16h4" />
            </svg>
            Notes
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
